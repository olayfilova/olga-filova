{% extends 'base.html'%}

{% block content %}

<div class="container mt-4">
    <h2> Confirm deletion</h2>
    <p> Are you sure you want to delete{{object}}? </p>
    <form method="post">
        {% csrf_token %}
        <button type='submit' class="btn btn-danger"> DELETE </button>
        <a href="{%url 'employee_list' %}" class="btn btn-secondary"> CANCEL </a>

    </form>

</div>

{% endblock %}
