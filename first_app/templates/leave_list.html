{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Leave Requests</h2>
    <a href="{% url 'leave_create' %}" class="btn btn-primary mb-3">Create New Leave Request</a>
    
    <table class="table">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Leave Type</th>
                <th>Start Date</th>
                <th>End Date</th>
            </tr>
        </thead>
        <tbody>
            {% for leave in leaves %}
            <tr>
                <td>{{ leave.employee }}</td>
                <td>{{ leave.get_leave_type_display }}</td>
                <td>{{ leave.start_date }}</td>
                <td>{{ leave.end_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
